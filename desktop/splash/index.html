<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Viewer</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        font: 14px/1.4 system-ui, -apple-system, sans-serif;
        background: Canvas; color: CanvasText;
      }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 14px;
        border: 3px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-top-color: CanvasText; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { opacity: 0.6; }
    </style>
  </head>
  <body>
    <!-- Production: the Rust shell navigates this window to the backend's loopback
         URL once the sidecar announces it. This page is only shown while the
         warm-OCCT Python engine starts. -->
    <div>
      <div class="spinner"></div>
      <div>Starting CAD engine…</div>
      <div class="hint">loading OpenCASCADE</div>
    </div>
  </body>
</html>
