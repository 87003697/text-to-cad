<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Viewer</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        background: Canvas; color: CanvasText;
      }
      .wrap { max-width: 30rem; padding: 1.5rem; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 14px;
        border: 3px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-top-color: CanvasText; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { opacity: 0.6; margin-top: 0.25rem; }
      #fallback { display: none; margin-top: 1rem; opacity: 0.85; }
      #fallback.show { display: block; }
      #fallback code { font-size: 0.85em; opacity: 0.9; }
      .stalled .spinner { animation-duration: 2s; opacity: 0.5; }
    </style>
  </head>
  <body>
    <!-- Production: the Tauri Rust shell navigates this window to the backend's
         loopback URL (CAD_VIEWER_URL) within ~1s of the CAD engine starting. This
         page is only shown while OpenCASCADE warms up. If it is opened standalone
         (a browser/preview, no Rust shell) it would otherwise spin forever, so we
         detect that and explain instead. -->
    <div class="wrap">
      <div class="spinner"></div>
      <div id="status">Starting CAD engine…</div>
      <div class="hint" id="subhint">loading OpenCASCADE</div>
      <div id="fallback"></div>
    </div>
    <script>
      (function () {
        var inTauri = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
        var fallback = document.getElementById('fallback');
        var status = document.getElementById('status');
        var subhint = document.getElementById('subhint');

        function show(html) { fallback.innerHTML = html; fallback.classList.add('show'); }

        if (!inTauri) {
          // Opened outside the desktop shell — nothing will navigate this window.
          setTimeout(function () {
            document.body.classList.add('stalled');
            status.textContent = 'CAD Viewer — desktop loading screen';
            subhint.textContent = '';
            show(
              'This is the splash shown inside the desktop app while the CAD engine starts. ' +
              'Opened on its own it has nothing to load.<br><br>' +
              'Run the actual viewer with the Python backend:<br>' +
              '<code>python -m server_py.server --dir &lt;models&gt; --announce-url</code><br>' +
              'then open the <code>CAD_VIEWER_URL</code> it prints.'
            );
          }, 1200);
          return;
        }

        // Inside Tauri but still here after a while → the backend is slow or failed.
        setTimeout(function () {
          document.body.classList.add('stalled');
          subhint.textContent = 'still starting…';
        }, 8000);
        setTimeout(function () {
          status.textContent = 'The CAD engine is taking longer than expected';
          subhint.textContent = '';
          show('If this persists, the backend may have failed to start — check the application logs.');
        }, 20000);
      })();
    </script>
  </body>
</html>
