[package]
name = "cad-viewer-desktop"
version = "0.0.0"
description = "CAD Viewer desktop shell (Tauri) — runs the bundled Python CAD backend sidecar."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cad_viewer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
