[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_runtime"
version = "0.1.0"
description = "Per-job Chromium + Playwright MCP container lifecycle for the bwrap Codex pilot."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["browser_runtime*"]

[tool.setuptools.package-data]
browser_runtime = ["image/image-lock.json"]
