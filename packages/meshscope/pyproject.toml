[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meshscope"
version = "0.1.0"
description = "Mesh inspection and canonical surface-occupancy toolkit."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.6",
  "Pillow==12.2.0",
  "trimesh==4.12.2",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["meshscope*"]
