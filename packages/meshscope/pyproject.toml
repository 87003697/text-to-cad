[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshscope"
version = "0.1.0"
description = "Mesh inspection and comparison toolkit for CAD reconstruction."
requires-python = ">=3.11"
dependencies = [
  "trimesh[easy]",
  "numpy",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["meshscope*"]
