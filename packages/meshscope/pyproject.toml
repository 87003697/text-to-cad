[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshscope"
version = "0.1.0"
description = "Mesh inspection and canonical surface-occupancy toolkit."
requires-python = ">=3.11"
dependencies = [
  "trimesh",
  "numpy",
  "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["meshscope*"]
