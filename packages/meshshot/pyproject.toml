[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshshot"
version = "0.1.0"
description = "Versioned browser renderer for canonical mesh residual previews."
requires-python = ">=3.11"
dependencies = [
  "Pillow",
  "playwright==1.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["meshshot*"]

[tool.setuptools.package-data]
meshshot = ["profiles/*.json", "runtime/*"]
